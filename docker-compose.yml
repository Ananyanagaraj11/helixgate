services:
  helixgate:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_ENV: compose
      HELIXGATE_JWT_SECRET: helixgate-demo-secret-key-32b!!!
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 8
