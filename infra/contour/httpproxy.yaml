apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: helixgate-edge
  namespace: helixgate
spec:
  virtualhost:
    fqdn: api.helixgate.dev
    tls:
      secretName: helixgate-edge-tls
      minimumProtocolVersion: "1.3"
  routes:
    - conditions:
        - prefix: /v2/creative
      loadBalancerPolicy:
        strategy: WeightedLeastRequest
      services:
        - name: cc-api.sjc.svc
          port: 8443
          weight: 70
        - name: cc-api.iad.svc
          port: 8443
          weight: 20
      rateLimitPolicy:
        local:
          requests: 2000
          unit: second
          burst: 4000
