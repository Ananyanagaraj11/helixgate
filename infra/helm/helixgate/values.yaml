gateway:
  name: helixgate-api
  replicaCount: 2
  hpa:
    min: 2
    max: 8
  host: control.helixgate.dev
  path: /
  tls:
    minVersion: "1.3"
    mtls: true
    daysToExpiry: 90
  auth:
    type: jwt
    audiences:
      - helixgate
  rateLimit:
    rps: 80
    burst: 160
    unit: jwt_sub
  regions:
    - id: sjc
      target: helixgate-api.sjc.svc:8080
      weight: 70
      healthy: true
    - id: iad
      target: helixgate-api.iad.svc:8080
      weight: 20
      healthy: true
    - id: fra
      target: helixgate-api.fra.svc:8080
      weight: 10
      healthy: true

image:
  repository: helixgate
  tag: "1.0.0"
