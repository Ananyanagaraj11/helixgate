apiVersion: apps/v1
kind: Deployment
metadata:
  name: helixgate-api
  namespace: helixgate
  labels:
    app: helixgate-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: helixgate-api
  template:
    metadata:
      labels:
        app: helixgate-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: helixgate:1.0.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: helixgate-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 8
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 20
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: helixgate-api
  namespace: helixgate
spec:
  selector:
    app: helixgate-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: helixgate-api
  namespace: helixgate
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: helixgate-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: helixgate-api
  namespace: helixgate
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    nginx.ingress.kubernetes.io/limit-rps: "80"
spec:
  tls:
    - hosts: ["control.helixgate.dev"]
      secretName: helixgate-api-tls
  rules:
    - host: control.helixgate.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: helixgate-api
                port:
                  number: 80
